plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = 'dev.rayvox'
version = '0.1.0'
base.archivesName = 'rayvox'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.228'
    runs {
        client { client() }
    }
    mods {
        rayvox { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.rayvox
    }
}

repositories { mavenCentral() }
configurations { vulkanNatives }
dependencies {
    for (module in ['lwjgl-vulkan', 'lwjgl-vma', 'lwjgl-shaderc']) {
        jarJar(implementation("org.lwjgl:${module}:3.3.3") { transitive = false }) { version { strictly '3.3.3' } }
        if (!providers.gradleProperty('rayvoxPackagedBenchmark').isPresent()) {
            additionalRuntimeClasspath("org.lwjgl:${module}:3.3.3") { transitive = false }
        }
    }
    for (module in ['lwjgl-vma', 'lwjgl-shaderc']) {
        runtimeOnly "org.lwjgl:${module}:3.3.3:natives-windows"
        if (!providers.gradleProperty('rayvoxPackagedBenchmark').isPresent()) {
            additionalRuntimeClasspath "org.lwjgl:${module}:3.3.3:natives-windows"
        }
        vulkanNatives "org.lwjgl:${module}:3.3.3:natives-windows"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep native resources alongside the mod; JarJar selects one artifact per module.
tasks.named('jar') {
    from({ configurations.vulkanNatives.collect { zipTree(it) } }) { include '**/*.dll' }
}

tasks.named('test') {
    useJUnitPlatform()
    exclude 'dev/rayvox/render/**'
    dependsOn 'vulkanTest'
    if (providers.gradleProperty('rayvoxColorBenchmark').isPresent()) {
        systemProperty 'rayvox.colorBenchmark', 'true'
        testLogging.showStandardStreams = true
        outputs.upToDateWhen { false }
    }
    if (providers.gradleProperty('rayvoxExtractionBenchmark').isPresent()) {
        systemProperty 'rayvox.extractionBenchmark', 'true'
        testLogging.showStandardStreams = true
        outputs.upToDateWhen { false }
    }
}

// Native bindings must share one loader; NeoForge's transformed test launcher has a second LWJGL loader.
tasks.register('vulkanTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('junit-fml-') }
    useJUnitPlatform()
    include 'dev/rayvox/render/**'
    dependsOn testClasses
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// The unit-test runtime omits client assets; compile production GLSL against the real vanilla includes.
tasks.named('processTestResources') {
    dependsOn tasks.named('createMinecraftArtifacts')
    from({ zipTree(fileTree(layout.buildDirectory.dir('moddev/artifacts')).matching {
        include '*-client-extra-aka-minecraft-resources.jar'
    }.singleFile) }) {
        include 'assets/minecraft/shaders/include/**'
        include 'assets/minecraft/shaders/core/**'
    }
}

tasks.register('cacheCheck') { dependsOn test }
tasks.named('check') { dependsOn cacheCheck }
tasks.register('lightingCheck') { dependsOn test }
tasks.named('check') { dependsOn lightingCheck }

tasks.register('materialCheck') { dependsOn test }

// Uses the same GLSL assets as the mod against a hidden, real OpenGL context.
tasks.register('gpuCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.rayvox.ShaderCheck'
}

tasks.register('lightingBenchmark', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.rayvox.LightingBenchmark'
}

tasks.register('gpuBenchmark', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.rayvox.ShaderCheck'
    args '--benchmark'
}

apply from: 'gradle/benchmark.gradle'
apply from: 'gradle/dlss.gradle'
